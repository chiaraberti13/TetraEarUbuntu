<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="TetraEar - installer per decoder TETRA su RTL-SDR">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08131f"/>
      <stop offset="0.55" stop-color="#0d2b34"/>
      <stop offset="1" stop-color="#0f3d3a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3b0"/>
      <stop offset="1" stop-color="#3fb6f0"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="320" rx="18" fill="url(#bg)"/>

  <!-- Radio waves emanating from the antenna -->
  <g fill="none" stroke="#22d3b0" stroke-width="3" stroke-linecap="round">
    <path d="M 150,110 A 40 40 0 0 1 150,190" opacity="0.9"/>
    <path d="M 150,80  A 70 70 0 0 1 150,220" opacity="0.6"/>
    <path d="M 150,50  A 100 100 0 0 1 150,250" opacity="0.38"/>
    <path d="M 150,20  A 130 130 0 0 1 150,280" opacity="0.20"/>
  </g>

  <!-- Antenna / mast -->
  <g stroke="#e9f6f2" stroke-width="4" stroke-linecap="round">
    <line x1="150" y1="150" x2="150" y2="262"/>
    <line x1="150" y1="262" x2="120" y2="286"/>
    <line x1="150" y1="262" x2="180" y2="286"/>
  </g>
  <circle cx="150" cy="150" r="9" fill="#22d3b0"/>

  <!-- Title -->
  <text x="240" y="150" font-size="76" font-weight="700" fill="#ffffff" letter-spacing="1">TetraEar</text>
  <text x="244" y="196" font-size="25" font-weight="500" fill="#8fe4d3">Installer automatico · TETRA decoder su RTL-SDR</text>
  <text x="244" y="226" font-size="19" font-weight="400" fill="#7fb8d6">Automated installer · TETRA decoder for RTL-SDR</text>

  <!-- Platform / topic pills -->
  <g font-size="16" font-weight="600" text-anchor="middle">
    <g>
      <rect x="244" y="248" width="98" height="34" rx="17" fill="#12313a" stroke="#22d3b0" stroke-opacity="0.5"/>
      <text x="293" y="270" fill="#8fe4d3">Ubuntu</text>
    </g>
    <g>
      <rect x="352" y="248" width="104" height="34" rx="17" fill="#12313a" stroke="#3fb6f0" stroke-opacity="0.5"/>
      <text x="404" y="270" fill="#a8d8f0">Windows</text>
    </g>
    <g>
      <rect x="466" y="248" width="108" height="34" rx="17" fill="#12313a" stroke="#22d3b0" stroke-opacity="0.5"/>
      <text x="520" y="270" fill="#8fe4d3">RTL-SDR</text>
    </g>
    <g>
      <rect x="584" y="248" width="92" height="34" rx="17" fill="#12313a" stroke="#3fb6f0" stroke-opacity="0.5"/>
      <text x="630" y="270" fill="#a8d8f0">TETRA</text>
    </g>
  </g>

  <!-- Spectrum / waterfall bars (top-right) -->
  <g fill="url(#accent)" opacity="0.92">
    <rect x="900"  y="150" width="10" height="40"  rx="3"/>
    <rect x="916"  y="120" width="10" height="70"  rx="3"/>
    <rect x="932"  y="90"  width="10" height="100" rx="3"/>
    <rect x="948"  y="60"  width="10" height="130" rx="3"/>
    <rect x="964"  y="100" width="10" height="90"  rx="3"/>
    <rect x="980"  y="130" width="10" height="60"  rx="3"/>
    <rect x="996"  y="70"  width="10" height="120" rx="3"/>
    <rect x="1012" y="45"  width="10" height="145" rx="3"/>
    <rect x="1028" y="95"  width="10" height="95"  rx="3"/>
    <rect x="1044" y="125" width="10" height="65"  rx="3"/>
    <rect x="1060" y="85"  width="10" height="105" rx="3"/>
    <rect x="1076" y="110" width="10" height="80"  rx="3"/>
    <rect x="1092" y="140" width="10" height="50"  rx="3"/>
    <rect x="1108" y="105" width="10" height="85"  rx="3"/>
  </g>

  <!-- Waveform baseline -->
  <path d="M 240,285 Q 300,265 360,285 T 480,285 T 600,285 T 720,285 T 840,285 T 960,285 T 1080,285 T 1160,285"
        fill="none" stroke="#3fb6f0" stroke-width="2.5" opacity="0.5" stroke-linecap="round"/>
</svg>
